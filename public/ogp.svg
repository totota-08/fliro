<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with deep green -->
  <rect width="1200" height="630" fill="#0b2e33"/>

  <!-- Logo icon (V3×V4 hybrid design) -->
  <g transform="translate(500, 80)">
    <rect width="200" height="200" rx="50" fill="#4f7c82"/>
    <!-- Stem: signature S-curve -->
    <path d="M122 37 C108 37, 95 47, 88 63 C82 83, 75 107, 68 127 C65 137, 58 150, 45 157" stroke="#ffffff" stroke-width="8.3" stroke-linecap="round" fill="none"/>
    <!-- Crossbar: sweeps across with flick -->
    <path d="M47 90 C67 83, 93 80, 123 78 C133 77, 140 78, 143 82" stroke="#ffffff" stroke-width="8.3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- App name with Sora-like style -->
  <text x="600" y="360" font-family="Sora, system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#a8d4d0" text-anchor="middle" letter-spacing="6">Fliro</text>

  <!-- Tagline: PROJECT FLOW -->
  <text x="600" y="405" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#4f7c82" text-anchor="middle" letter-spacing="6">PROJECT FLOW</text>

  <!-- Main tagline -->
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="rgba(168,212,208,0.9)" text-anchor="middle">チームの「今やるべきこと」を、シンプルに。</text>

  <!-- Subtitle -->
  <text x="600" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(79,124,130,0.8)" text-anchor="middle">小規模チーム向けプロジェクト管理ツール</text>
</svg>
