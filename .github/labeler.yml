frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "public/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**"
          - "hoge.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "firebase.json"
          - "firestore.rules"
          - "vite.config.ts"
