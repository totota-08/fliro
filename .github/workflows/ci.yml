name: Pull Request Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"

jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npx prettier --check .

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

  typecheck:
    name: Type Check (vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vue-tsc
        run: npm run typecheck

  static-analysis:
    name: Static Analysis (Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build

  security-scan:
    name: Security Scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high

  tests:
    name: Tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build test image
        run: |
          docker build -t fliro-ci-test --build-arg NODE_VERSION=${{ env.NODE_VERSION }} -f - . <<'EOF'
          ARG NODE_VERSION
          FROM node:${NODE_VERSION:-20}-bookworm

          ENV CI=true
          ENV JAVA_HOME=/opt/java/openjdk
          ENV PATH="$JAVA_HOME/bin:$PATH"
          WORKDIR /workspace

          RUN apt-get update \
            && apt-get install -y --no-install-recommends wget ca-certificates git curl \
            && curl -L "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse" -o /tmp/jdk21.tar.gz \
            && mkdir -p "$JAVA_HOME" \
            && tar -xzf /tmp/jdk21.tar.gz -C "$JAVA_HOME" --strip-components=1 \
            && rm -rf /var/lib/apt/lists/* /tmp/jdk21.tar.gz

          COPY package*.json ./
          RUN npm ci

          COPY . .
          CMD ["npm","run","test:rules"]
          EOF
      - name: Run tests in Docker
        run: docker run --rm fliro-ci-test
