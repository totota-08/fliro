name: Auto Version Bump

on:
  push:
    branches: [develop]

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  bump-version:
    if: github.actor != 'github-actions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bump version (patch)
        run: |
          node -e "
          const fs = require('fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const match = pkg.version.match(/^(.*?)(\\d+)\\.(\\d+)\\.(\\d+)$/);
          if (!match) throw new Error('Unexpected version format: ' + pkg.version);
          const prefix = match[1];
          let [major, minor, patch] = match.slice(2).map(Number);
          patch += 1;
          const next = `${prefix}${major}.${minor}.${patch}`;
          pkg.version = next;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\\n');

          const lockPath = 'package-lock.json';
          if (fs.existsSync(lockPath)) {
            const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
            lock.version = next;
            if (lock.packages && lock.packages['']) {
              lock.packages[''].version = next;
            }
            fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\\n');
          }
          console.log(`Bumped version to ${pkg.version}`);
          "
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version"
          git push origin HEAD:develop
